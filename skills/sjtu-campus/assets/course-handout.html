<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{课程名}} · {{讲义范围}}</title>
<style>
:root{--zh:#6a737d;--accent:#0969da}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;color:#1f2328;line-height:1.65;font-size:16px;background:#fff}
nav{position:fixed;top:0;left:0;bottom:0;width:290px;overflow-y:auto;padding:18px 14px 40px;background:#f6f8fa;border-right:1px solid #d0d7de;font-size:13px}
nav .title{font-weight:700;font-size:14px;margin:0 0 10px}
nav a{display:block;color:#1f2328;text-decoration:none;padding:3px 6px;border-radius:5px;line-height:1.35}
nav a:hover{background:#e7ecf0}
nav a.h1{font-weight:700;margin-top:10px;color:var(--accent)}
nav a.h2{padding-left:16px}
nav small{display:block;color:var(--zh);font-size:11.5px}
main{margin-left:290px;padding:64px 48px 120px;max-width:1080px}
.toolbar{position:fixed;top:0;left:290px;right:0;z-index:9;display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;background:rgba(255,255,255,.92);backdrop-filter:blur(4px);border-bottom:1px solid #eaeef2}
.toolbar button{font:inherit;font-size:13px;padding:5px 12px;border:1px solid #d0d7de;border-radius:6px;background:#fff;cursor:pointer}
.toolbar button:hover{background:#f3f4f6}
h1{border-bottom:3px solid var(--accent);padding-bottom:.3em;margin-top:2.4em;font-size:1.85em;line-height:1.3;scroll-margin-top:60px}
main>h1:first-child{margin-top:0}
h2{border-bottom:1px solid #d0d7de;padding-bottom:.25em;margin-top:2em;color:#0550ae;font-size:1.45em;scroll-margin-top:60px}
h3{margin-top:1.7em;font-size:1.15em;background:#f6f8fa;padding:6px 10px;border-left:4px solid var(--accent);border-radius:0 6px 6px 0;scroll-margin-top:60px}
h4{margin:1.4em 0 .4em;font-size:1.02em;color:#57606a}
h1 .zh,h2 .zh,h3 .zh,h4 .zh{display:inline;margin-left:.6em;font-weight:500;font-size:.72em;color:var(--zh)}
.zh{display:block;color:var(--zh);font-size:.9em;line-height:1.5;margin-top:1px}
li{margin:.35em 0}
code{background:#eff1f3;padding:.1em .35em;border-radius:4px;font-size:.88em;font-family:SFMono-Regular,Menlo,monospace}
h3 code{background:#e2e6ea;font-size:.75em;font-weight:400}
pre{background:#f6f8fa;border:1px solid #d0d7de;border-radius:6px;padding:12px 14px;overflow-x:auto;line-height:1.45}
pre code{background:none;padding:0;font-size:.85em}
table{border-collapse:collapse;margin:1em 0;width:100%;font-size:.95em}
th,td{border:1px solid #d0d7de;padding:7px 10px;vertical-align:top}
th{background:#f0f3f6;text-align:left}
tr:nth-child(even) td{background:#fafbfc}
blockquote{margin:1em 0;padding:.6em 1em;background:#fff8e1;border-left:4px solid #d4a72c;color:#3d3420;border-radius:0 6px 6px 0}
blockquote p{margin:.35em 0}
blockquote .zh{color:#7a6a40}
blockquote table td,blockquote table th{background:#fffdf3}
strong{color:#b3261e}
hr{border:none;border-top:2px dashed #d0d7de;margin:3em 0}
a{color:var(--accent);text-decoration:none}
input.todo{transform:scale(1.15);margin-right:6px;vertical-align:-1px;cursor:pointer}
li:has(>input.todo:checked){color:#8c959f;text-decoration:line-through}
.katex{font-size:1.08em}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:2px 0;margin:.6em 0}
.zh .katex{font-size:1em}
.math-error{color:#cf222e}
figure.fig{margin:1.2em 0 1.6em;padding:14px 14px 8px;border:1px solid #d8dee4;border-radius:10px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.fig-row{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;align-items:center}
.fig-cell{max-width:100%;overflow-x:auto}
figure.fig figcaption{margin-top:8px;font-size:.9em;color:#57606a;text-align:center;line-height:1.5}
figure.fig figcaption .zh{display:block}
.sol{border:1px solid #d0d7de;border-left:4px solid #1a7f37;border-radius:0 8px 8px 0;padding:4px 18px 10px;margin:1em 0 1.6em;background:#fbfefb}
body.hide-zh .zh{display:none!important}
body.hide-zh nav small{display:none}
body.hide-sol .sol{display:none}
@media (max-width:1000px){nav{display:none}main{margin-left:0;padding:60px 18px 80px}.toolbar{left:0}}
@media print{nav,.toolbar{display:none}main{margin:0;max-width:none;padding:0}body{font-size:11.5px}h1{page-break-before:always}main>h1:first-child{page-break-before:avoid}pre,table,blockquote,h3,.katex-display{page-break-inside:avoid}}
li:has(>label>input.todo:checked){color:#8c959f;text-decoration:line-through}
.fig-cell img,.fig-cell svg{display:block;max-width:100%;height:auto}
@media print{figure.fig{break-inside:avoid}h2,h3{break-after:avoid}}
</style>
</head>
<body data-handout="{{课程与范围的稳定标识}}">
<nav aria-label="讲义目录"><div class="title">目录</div></nav>
<div class="toolbar" role="group" aria-label="阅读工具">
  <button type="button" id="toggle-notes" aria-pressed="false">隐藏中文（自测）</button>
  <button type="button" id="print">打印 / 存 PDF</button>
</div>
<main>
<h1 id="overview">{{课程名}} · {{讲义范围}}</h1>
<blockquote><p>{{覆盖的讲次、实际使用的材料与需要复核的范围。}}</p></blockquote>
<h2 id="reading-map">复习导览</h2>
<table>
  <thead><tr><th scope="col">讲次 / 主题</th><th scope="col">复习时要能回答的问题</th></tr></thead>
  <tbody><tr><td><a href="#chapter-1">{{讲次或主题}}</a></td><td>{{核心问题}}</td></tr></tbody>
</table>
<h2 id="checklist">自测清单</h2>
<ul><li><label><input class="todo" type="checkbox" data-key="{{稳定的知识点标识}}">{{可通过回忆、解释或计算验证的学习目标}}</label></li></ul>

<h1 id="chapter-1">{{第一章或讲次标题}} <span class="zh">{{可选中文副题}}</span></h1>
<h2 id="topic-1">{{主题标题}} <span class="zh">{{可选中文副题}}</span></h2>
<h3 id="point-1">{{知识点}} <code>{{课件页码或录像时间点}}</code></h3>
<ul>
  <li>{{来自本课材料的定义、结论或方法。}}<span class="zh">{{对应中文译注、直观解释或自测提示。}}</span></li>
</ul>
<!-- 按需保留下列组件。无实际内容的组件应删除。 -->
<blockquote><p><strong>{{易混之处}}</strong> {{材料支持的解释或适用条件。}}</p></blockquote>
<figure class="fig">
  <div class="fig-row"><div class="fig-cell">{{在此嵌入本课的图像或内联 SVG，提供可访问的图名。}}</div></div>
  <figcaption>{{图中要读出的关系，以及本课出处。}}</figcaption>
</figure>
</main>
<script>
(() => {
  const nav = document.querySelector('nav');
  for (const heading of document.querySelectorAll('main > h1[id], main > h2[id]')) {
    const link = document.createElement('a');
    link.className = heading.localName;
    link.href = '#' + heading.id;
    const copy = heading.cloneNode(true);
    const note = copy.querySelector('.zh');
    if (note) note.remove();
    link.textContent = copy.textContent.trim();
    if (note) {
      const small = document.createElement('small');
      small.textContent = note.textContent;
      link.append(small);
    }
    nav.append(link);
  }

  const prefix = 'campus-handout:' + document.body.dataset.handout + ':';
  function read(key) {
    try { return localStorage.getItem(prefix + key) === '1'; }
    catch { return false; }
  }
  function save(key, enabled) {
    try { localStorage.setItem(prefix + key, enabled ? '1' : '0'); }
    catch { /* 本次阅读仍可使用勾选和自测。 */ }
  }
  for (const box of document.querySelectorAll('input.todo[data-key]')) {
    const key = 'check:' + box.dataset.key;
    box.checked = read(key);
    box.addEventListener('change', () => save(key, box.checked));
  }
  const toggle = document.getElementById('toggle-notes');
  toggle.hidden = !document.querySelector('main .zh');
  function showNotes(hidden) {
    document.body.classList.toggle('hide-zh', hidden);
    toggle.setAttribute('aria-pressed', String(hidden));
    toggle.textContent = hidden ? '显示中文' : '隐藏中文（自测）';
  }
  showNotes(read('hide-zh'));
  toggle.addEventListener('click', () => {
    const hidden = !document.body.classList.contains('hide-zh');
    showNotes(hidden);
    save('hide-zh', hidden);
  });
  document.getElementById('print').addEventListener('click', () => window.print());
})();
</script>
</body>
</html>
